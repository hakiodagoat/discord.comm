        @keyframes glowPulse {

        }
        @keyframes glitch {
            0% { text-shadow: -2px 0 red, 2px 0 blue; }

        button {

            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 15px;
            transition: all 0.2s;
        }
        button:hover {
            background: #ff00ff;
            color: white;

</head>
<body>
